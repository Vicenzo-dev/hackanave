<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacka Nav - Hub Central</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #130924; 
            --bg-gradient-end: #090312;
            --glass: rgba(255, 255, 255, 0.04);
            --neon-purple: #a855f7;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --text-white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --font-scale: 1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #2c1259, var(--bg-deep), var(--bg-gradient-end));
            background-attachment: fixed;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            transition: var(--transition);
        }

        body.large-fonts { --font-scale: 1.2; }

        /* ----- CONTROLES TOPO (RESPONSIVOS) ----- */
        .top-controls-container {
            position: fixed;
            top: 15px;
            right: 15px;
            left: 15px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            z-index: 1000;
            flex-wrap: wrap;
        }

        .accessibility-bar, .tutorial-trigger-bar {
            background: rgba(19, 9, 36, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 8px 12px;
            border-radius: 50px;
            display: flex;
            gap: 8px;
        }

        .acc-btn, .tutorial-btn {
            background: transparent;
            border: none;
            color: #d1c4e9;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 20px;
            transition: var(--transition);
        }

        .acc-btn:hover, .acc-btn.active, .tutorial-btn:hover {
            color: #ffffff;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-blue));
        }

        /* GAVETA DE TUTORIAIS */
        .tutorial-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: rgba(15, 7, 30, 0.98);
            backdrop-filter: blur(20px);
            border-left: 2px solid var(--neon-purple);
            z-index: 2000;
            transition: right 0.5s ease;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .tutorial-drawer.open { right: 0; }

        .video-item { margin-bottom: 25px; }
        .video-item h4 { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--neon-blue); margin-bottom: 10px; }
        .video-frame { 
            width: 100%; 
            aspect-ratio: 16/9; 
            border-radius: 12px; 
            border: 1px solid var(--neon-purple); 
        }

        /* HUB CENTRAL */
        .hub-container {
            width: 100%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: calc(40px * var(--font-scale)) 20px;
            text-align: center;
            margin-top: 60px;
        }

        /* LOGO PNG RESTAURADA */
        .main-logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px var(--neon-blue));
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: calc(2.2rem * var(--font-scale));
            background: linear-gradient(to right, #fff, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .nav-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: white;
            transition: var(--transition);
        }

        .nav-card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-blue);
            background: rgba(168, 85, 247, 0.1);
        }

        .card-icon { font-size: 40px; margin-bottom: 15px; display: block; }
        .card-title { font-family: 'Orbitron'; font-size: 1rem; color: var(--neon-blue); margin-bottom: 10px; }
        .card-desc { font-size: 0.85rem; opacity: 0.7; line-height: 1.5; }

        @media (max-width: 600px) {
            .top-controls-container { justify-content: center; top: 10px; }
            .hub-container { margin-top: 100px; }
            .logo-text { font-size: 1.6rem; }
            .tutorial-drawer { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="top-controls-container">
        <div class="tutorial-trigger-bar">
            <button class="tutorial-btn" onclick="toggleDrawer(true)">📺 Tutoriais</button>
        </div>
        <div class="accessibility-bar">
            <button class="acc-btn" id="btnIdoso" onclick="toggleModo('idoso')">👴 Idoso</button>
            <button class="acc-btn" id="btnCego" onclick="toggleModo('cego')">👁️ Cego</button>
        </div>
    </div>

    <div id="tutorialDrawer" class="tutorial-drawer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h3 style="font-family: 'Orbitron'; color: var(--neon-blue);">ACADEMY</h3>
            <button onclick="toggleDrawer(false)" style="background:none; border:none; color:white; font-size:1.8rem; cursor:pointer;">✕</button>
        </div>
        
        <div style="overflow-y: auto; flex: 1; padding-right: 10px;">
            <div class="video-item">
                <h4>1. Como usar o Scanner</h4>
                <iframe class="video-frame" src="https://www.youtube.com/embed/LINK_DO_VIDEO_1" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="video-item">
                <h4>2. Detectando Fake News</h4>
                <iframe class="video-frame" src="https://www.youtube.com/embed/LINK_DO_VIDEO_2" frameborder="0" allowfullscreen></iframe>
            </div>
            <p style="text-align: center; font-size: 0.8rem; color: #a855f7;">Role para ver mais conteúdos</p>
        </div>
    </div>

    <div class="hub-container">
        <img src="image-removebg-preview.png" alt="Hacka Nave Logo" class="main-logo" style="max-width: 140px;">
        
        <h1 class="logo-text">Hacka Nave</h1>
        <p style="font-family: 'Orbitron'; color: var(--neon-purple); font-size: 0.7rem; letter-spacing: 3px;">DEFESA DIGITAL // 2026</p>

        <div class="hub-grid">
            <a href="Hackanav.html" class="nav-card">
                <span class="card-icon">📸</span>
                <h2 class="card-title">Scanner</h2>
                <p class="card-desc">Análise profunda de imagens e metadados.</p>
            </a>

            <a href="audio.html" class="nav-card">
                <span class="card-icon">🔊</span>
                <h2 class="card-title">Áudio</h2>
                <p class="card-desc">Verificação de integridade sonora e vozes.</p>
            </a>

            <a href="quiz.html" class="nav-card" style="border-color: var(--neon-pink);">
                <span class="card-icon">🧠</span>
                <h2 class="card-title" style="color: var(--neon-pink);">Quiz</h2>
                <p class="card-desc">Treinamento completo em 3 módulos.</p>
            </a>
        </div>
    </div>

    <script>
        function toggleDrawer(open) {
            document.getElementById('tutorialDrawer').classList.toggle('open', open);
        }

        let modoAtivo = null;
        function toggleModo(modo) {
            document.body.classList.remove('large-fonts');
            if (modoAtivo === modo) {
                modoAtivo = null;
                document.querySelectorAll('.acc-btn').forEach(b => b.classList.remove('active'));
                return;
            }
            modoAtivo = modo;
            if (modo === 'idoso') document.body.classList.add('large-fonts');
            document.querySelectorAll('.acc-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn' + modo.charAt(0).toUpperCase() + modo.slice(1)).classList.add('active');
        }
    </script>
</body>
</html>
