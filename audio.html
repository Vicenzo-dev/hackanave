<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacka Nav - Varredura de Áudio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&family=Poppins:wght=300;400;600&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg-deep: #130924; 
        --bg-gradient-end: #090312;
        --glass: rgba(255, 255, 255, 0.04);
        --neon-purple: #a855f7;
        --neon-pink: #ff007f;
        --neon-blue: #00f0ff;
        --text-white: #ffffff;
        --success-green: #00ff9d;
        --error-red: #ff3b69;
        --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        --font-scale: 1;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: radial-gradient(circle at top right, #2c1259, var(--bg-deep), var(--bg-gradient-end));
        background-attachment: fixed;
        color: var(--text-white);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition: var(--transition);
        overflow-x: hidden;
        position: relative;
    }

    /* Barra de Acessibilidade Ajustada */
    .accessibility-bar {
        position: fixed;
        top: 15px;
        right: 15px;
        background: rgba(19, 9, 36, 0.9);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(168, 85, 247, 0.4);
        padding: 8px 15px;
        border-radius: 50px;
        display: flex;
        gap: 10px;
        z-index: 1000;
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    .acc-btn {
        background: transparent;
        border: none;
        color: #d1c4e9;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.7rem; /* Menor no mobile */
        font-weight: 700;
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 20px;
        transition: var(--transition);
    }

    /* Botão Voltar */
    .btn-back-hub {
        position: fixed;
        top: 15px;
        left: 15px;
        background: var(--glass);
        backdrop-filter: blur(15px);
        padding: 10px 18px;
        border-radius: 50px;
        color: #d1c4e9;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.7rem;
        text-decoration: none;
        z-index: 100;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Container Adaptativo */
    .app-container {
        width: 100%;
        max-width: 550px;
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: calc(30px * var(--font-scale)) calc(20px * var(--font-scale));
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        margin-top: 50px; /* Espaço para os botões fixos */
    }

    .logo-text {
        font-family: 'Orbitron', sans-serif;
        font-size: calc(1.8rem * var(--font-scale)); /* Reduzido para telas pequenas */
        font-weight: 900;
        background: linear-gradient(to right, #ffffff, #c0a5ff, #ff007f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .tagline {
        font-family: 'Orbitron', sans-serif;
        font-size: calc(0.7rem * var(--font-scale));
        color: #b194ff;
        letter-spacing: 2px;
        margin-bottom: 20px;
    }

    /* Área de Upload / Card */
    .upload-card {
        border: 2px dashed rgba(157, 80, 187, 0.4);
        border-radius: 16px;
        padding: 30px 15px;
        background: rgba(168, 85, 247, 0.02);
        margin-bottom: 20px;
    }

    #audioPlayer {
        width: 100%;
        margin-top: 15px;
        filter: invert(100%) hue-rotate(180deg); /* Faz o player padrão combinar com o tema escuro */
    }

    .btn-analyze {
        width: 100%;
        padding: 16px;
        border-radius: 50px;
        background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
        color: white;
        font-size: 1rem;
        font-weight: 700;
        text-transform: uppercase;
        border: none;
        box-shadow: 0 8px 20px rgba(255, 0, 127, 0.3);
    }

    /* Popups e Resultados */
    .nav-popup {
        width: 90%; /* Ocupa quase toda a largura no mobile */
        max-width: 400px;
        font-size: 1rem;
    }

    /* --- Media Queries para Telas Maiores --- */
    @media (min-width: 768px) {
        .logo-text { font-size: calc(2.6rem * var(--font-scale)); }
        .tagline { font-size: calc(0.9rem * var(--font-scale)); }
        .app-container { padding: 40px; margin-top: 0; }
        .acc-btn { font-size: 0.8rem; }
        .btn-back-hub { font-size: 0.85rem; top: 25px; left: 25px; }
        .accessibility-bar { top: 25px; right: 25px; }
    }
</style>
</head>
<body>

    <div class="accessibility-bar">
        <button class="acc-btn" id="btnIdoso" onclick="toggleModo('idoso')">👴 Modo Idoso</button>
        <button class="acc-btn" id="btnCego" onclick="toggleModo('cego')">👁️ Modo Cego</button>
    </div>

    <a href="inicio.html" class="btn-back-hub">
        <span>⬅</span> MÓDULO INICIAL
    </a>

    <div class="app-container">
        <div class="logo-area">
            <img src="image-removebg-preview.png" alt="Hacka Nave Logo" class="logo-top-img" style="max-width: 140px;">
            <h1 class="logo-text">Varredura de Áudio</h1>
            <div class="tagline">Vz-Dev 2026</div>
        </div>

        <div id="voiceIndicator" class="voice-input-indicator">👇 Clique em qualquer lugar para liberar o microfone.</div>

        <div class="upload-card" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon" style="font-size: 45px; display: block;">🎙️</span>
            <span id="uploadText">Clique para carregar um arquivo de áudio (MP3, WAV, M4A)</span>
            <input type="file" id="fileInput" accept="audio/*" style="display: none;">
            <audio id="audioPlayer" controls></audio>
        </div>

        <button id="analyzeBtn" class="btn-analyze" onclick="analisarAudio()" disabled>Iniciar Varredura</button>

        <div class="loading" id="loading">Sintonizando frequências e descriptografando áudio... Aguarde.</div>

        <div class="result-box" id="resultBox"></div>
    </div>

    <div id="navAlertPopup" class="nav-popup"></div>

<script>
    const GROQ_API_KEY = "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"; 
    const fileInput = document.getElementById('fileInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const uploadText = document.getElementById('uploadText');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const voiceIndicator = document.getElementById('voiceIndicator');
    let arquivoAudio = null;

    let modoAtivo = null; 
    let synth = window.speechSynthesis;
    let recognition = null;
    let micIniciado = false;

    // ----- INICIALIZAÇÃO CORRIGIDA DO MICROFONE -----
    function inicializarMicrofone() {
        if (micIniciado) return;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechObj = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechObj();
            recognition.lang = 'pt-BR';
            
            // Configuração contínua impede que o Chrome solicite permissão a cada pausa
            recognition.continuous = true; 
            recognition.interimResults = false;

            recognition.onstart = function() {
                micIniciado = true;
                if(!modoAtivo){
                    voiceIndicator.innerText = "🎤 Ouvindo... Diga 'Acessibilidade'";
                    voiceIndicator.className = "voice-input-indicator listening";
                }
            };

            recognition.onerror = function(event) {
                console.error("Erro capturado:", event.error);
                if(event.error === 'not-allowed') {
                    voiceIndicator.innerText = "❌ Ative a permissão do microfone no topo do navegador.";
                    voiceIndicator.className = "voice-input-indicator error";
                }
            };

            recognition.onresult = function(event) {
                const indexAtual = event.resultIndex;
                const falaUsuario = event.results[indexAtual][0].transcript.toLowerCase().replace(/[\.\?,]/g, '').trim();
                console.log("Comando por voz identificado:", falaUsuario);
                
                // Gatilho por voz para voltar à página inicial
                if (falaUsuario.includes("voltar") || falaUsuario.includes("início") || falaUsuario.includes("inicio")) {
                    falarNarracao("A retornar ao módulo inicial.");
                    setTimeout(() => {
                        window.location.href = "inicio.html"; 
                    }, 1500);
                    return;
                }
                
                if (falaUsuario.includes("acessibilidade")) {
                    if (modoAtivo !== 'cego') {
                        toggleModo('cego');
                    }
                } else if (falaUsuario.includes("iniciar") || falaUsuario.includes("varrer") || falaUsuario.includes("analisar")) {
                    if(!analyzeBtn.disabled) {
                        analisarAudio();
                    }
                }
            };

            recognition.onend = function() {
                if (micIniciado && modoAtivo === 'cego') {
                    try { recognition.start(); } catch(e){}
                }
            };

            try {
                recognition.start();
            } catch(e) {
                console.log("Instância ativa detectada.");
            }
        } else {
            voiceIndicator.innerText = "❌ Navegador incompatível com API de voz.";
            voiceIndicator.className = "voice-input-indicator error";
        }
    }

    window.addEventListener('click', inicializarMicrofone);
    
    window.addEventListener('keydown', function(e) {
        inicializarMicrofone();
        if (e.code === "Space") {
            toggleModo('cego');
        }
    });

    // ----- GESTÃO DE ACESSIBILIDADE -----
    function toggleModo(modo) {
        if(synth) synth.cancel();

        document.body.classList.remove('large-fonts');
        document.getElementById('btnIdoso').classList.remove('active');
        document.getElementById('btnCego').classList.remove('active');

        if (modoAtivo === modo) {
            modoAtivo = null;
            voiceIndicator.innerText = "🎤 Ouvindo... Diga 'Acessibilidade'";
            voiceIndicator.className = "voice-input-indicator listening";
            return;
        }

        modoAtivo = modo;
        document.getElementById('btn' + modo.charAt(0).toUpperCase() + modo.slice(1)).classList.add('active');

        if (modo === 'idoso') {
            document.body.classList.add('large-fonts');
            voiceIndicator.innerText = "👵 Modo Idoso. Fale 'Iniciar' ou use a tela.";
            voiceIndicator.className = "voice-input-indicator listening";
            falarNarracao("Modo idoso ativado. Textos ampliados.");
        }

        if (modo === 'cego') {
            voiceIndicator.innerText = "👁️ Modo Cego. Fale 'Iniciar' para escanear.";
            voiceIndicator.className = "voice-input-indicator listening";
            falarNarracao("Modo para deficientes visuais ativado. Fale Iniciar para varrer o arquivo carregado.");
        }
    }

    function falarNarracao(texto) {
        if(!synth || (modoAtivo !== 'idoso' && modoAtivo !== 'cego')) return;
        synth.cancel(); 
        let textoLimpo = texto.replace(/<\/?[^>]+(>|$)/g, "").replace(/\*\*/g, "");
        let utterance = new SpeechSynthesisUtterance(textoLimpo);
        utterance.lang = 'pt-BR';
        synth.speak(utterance);
    }

    // ----- INTEGRAÇÃO DE ARQUIVOS -----
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            arquivoAudio = file;
            const urlAudio = URL.createObjectURL(file);
            audioPlayer.src = urlAudio;
            audioPlayer.style.display = 'block';
            uploadText.innerText = `Arquivo carregado: ${file.name}`;
            analyzeBtn.disabled = false;
            falarNarracao(`Arquivo ${file.name} pronto para varredura.`);
        }
    });

    function mostrarPopup(mensagem, tipo) {
        const popup = document.getElementById('navAlertPopup');
        popup.innerText = mensagem;
        popup.className = 'nav-popup'; 
        if(tipo === 'verdadeiro') popup.classList.add('pop-verde');
        else popup.classList.add('pop-vermelho');
        popup.classList.add('show');
        setTimeout(() => { popup.classList.remove('show'); }, 4000);
    }

    // ----- PROCESSAMENTO FORENSE -----
    async function analisarAudio() {
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');

        document.body.classList.remove('is-true', 'is-fake');
        loading.style.display = 'block';
        resultBox.style.display = 'none';
        analyzeBtn.disabled = true;

        falarNarracao("Processando verificação pericial.");

        try {
            const formData = new FormData();
            formData.append("file", arquivoAudio);
            formData.append("model", "whisper-large-v3");
            formData.append("language", "pt");

            const transcreveResponse = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${GROQ_API_KEY}` },
                body: formData
            });

            if (!transcreveResponse.ok) throw new Error("Falha na transcrição.");

            const transcreveDados = await transcreveResponse.json();
            const textoTranscrito = transcreveDados.text;

            const promptContexto = `Você é um Perito Forense Computacional. Analise: "${textoTranscrito}". Formato exigido: [VEREDITO]: SEGURO ou [VEREDITO]: CRÍTICO seguido de um parecer de 4 linhas.`;

            const respostaTexto = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-4-scout-17b-16e-instruct", 
                    messages: [ { role: "user", content: promptContexto } ],
                    temperature: 0.1
                })
            });

            if (!respostaTexto.ok) throw new Error("Falha na análise.");

            const dadosFinais = await respostaTexto.json();
            const textoResposta = dadosFinais.choices[0].message.content;

            resultBox.innerHTML = formatarTexto(textoResposta);
            resultBox.style.display = 'block';
            
            if(textoResposta.includes("[VEREDITO]: CRÍTICO")) {
                resultBox.style.borderLeftColor = "#ff4d6d"; 
                document.body.classList.add('is-fake');
                mostrarPopup("ÁUDIO COM FORTES INDÍCIOS DE IA / FRAUDE", "fake");
                falarNarracao("Atenção. Veredito crítico detectado.");
            } else {
                resultBox.style.borderLeftColor = "#10b981"; 
                document.body.classList.add('is-true');
                mostrarPopup("CONTEÚDO SEGURO / AUTÊNTICO", "verdadeiro");
                falarNarracao("Análise concluída. Conteúdo seguro.");
            }

            setTimeout(() => {
                falarNarracao("Relatório completo: " + textoResposta);
            }, 4000);

        } catch (error) {
            console.error(error);
            falarNarracao("Erro operacional na varredura.");
        } finally {
            loading.style.display = 'none';
            analyzeBtn.disabled = false;
        }
    }

    function formatarTexto(texto) {
        return texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }
</script>

</body>
</html>
