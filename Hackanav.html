<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacka Nav - Varredura de Imagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&family=Poppins:wght=300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #130924; 
            --bg-gradient-end: #090312;
            --glass: rgba(255, 255, 255, 0.04);
            --neon-purple: #a855f7;
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --text-white: #ffffff;
            --success-green: #00ff9d;
            --error-red: #ff3b69;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --font-scale: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #2c1259, var(--bg-deep), var(--bg-gradient-end));
            background-attachment: fixed;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 20px 20px;
            transition: var(--transition);
            overflow-x: hidden;
            position: relative;
        }

        .accessibility-bar {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(19, 9, 36, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            gap: 15px;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .acc-btn {
            background: transparent;
            border: none;
            color: #d1c4e9;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .acc-btn:hover, .acc-btn.active {
            color: #ffffff;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-blue));
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        body.large-fonts {
            --font-scale: 1.3;
        }
        
        .app-container {
            width: 100%;
            max-width: 620px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: calc(40px * var(--font-scale)) calc(30px * var(--font-scale));
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: calc(2.6rem * var(--font-scale));
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ffffff, #c0a5ff, #ff007f);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            margin: 0;
        }

        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: calc(0.9rem * var(--font-scale));
            color: #b194ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        #uploadText {
            font-size: calc(0.95rem * var(--font-scale));
            color: #d1c4e9;
            display: block;
            margin-bottom: 10px;
        }

        .btn-analyze {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            color: white;
            font-size: calc(1rem * var(--font-scale));
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 20px rgba(255, 0, 127, 0.2);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn-analyze:disabled {
            background: #2d263b;
            color: #6d6185;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-box {
            margin-top: 30px;
            text-align: left;
            background: rgba(7, 3, 15, 0.6);
            border-radius: 16px;
            padding: 25px;
            display: none;
            border-left: 5px solid var(--neon-purple);
            line-height: 1.6;
            font-size: calc(0.95rem * var(--font-scale));
            white-space: pre-wrap;
            animation: slideUp 0.5s ease forwards;
        }

        .voice-input-indicator {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 20px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid var(--neon-purple);
            color: #d1c4e9;
            border-radius: 50px;
            font-size: 0.85rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
            transition: var(--transition);
        }

        .voice-input-indicator.listening {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .voice-input-indicator.error {
            background: rgba(255, 59, 105, 0.15);
            border-color: var(--error-red);
            color: var(--error-red);
        }

        .btn-back-hub {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 50px;
            color: #d1c4e9;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .upload-card {
            border: 2px dashed rgba(157, 80, 187, 0.4);
            border-radius: 16px;
            padding: 35px 20px;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(168, 85, 247, 0.02);
            margin-bottom: 25px;
        }

        #preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            display: none;
            margin-top: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loading {
            display: none;
            margin: 20px auto;
            font-weight: bold;
            color: var(--neon-pink);
        }

        body.is-fake { background: radial-gradient(circle at top right, #50081d, #140207) !important; }
        body.is-true { background: radial-gradient(circle at top right, #074022, #021209) !important; }
        .is-fake .app-container { border-color: var(--error-red); }
        .is-true .app-container { border-color: var(--success-green); }

        .nav-popup {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 35px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: #fff;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }
        .nav-popup.pop-verde { background: linear-gradient(135deg, #00ff9d, #057a4e); border: 2px solid #00ff9d; }
        .nav-popup.pop-vermelho { background: linear-gradient(135deg, #ff3b69, #9e0c2e); border: 2px solid #ff3b69; }
        .nav-popup.show { animation: popupInAndOut 4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        @keyframes popupInAndOut {
            0% { bottom: -100px; opacity: 0; transform: translateX(-50%) scale(0.9); }
            15% { bottom: 40px; opacity: 1; transform: translateX(-50%) scale(1); }
            85% { bottom: 40px; opacity: 1; transform: translateX(-50%) scale(1); }
            100% { bottom: 150px; opacity: 0; transform: translateX(-50%) scale(0.9); }
        }
    </style>
</head>
<body>

    <div class="accessibility-bar">
        <button class="acc-btn" id="btnIdoso" onclick="toggleModo('idoso')">👴 Modo Idoso</button>
        <button class="acc-btn" id="btnCego" onclick="toggleModo('cego')">👁️ Modo Cego</button>
    </div>

    <a href="inicio.html" class="btn-back-hub">
        <span>⬅</span> MÓDULO INICIAL
    </a>

    <div class="app-container">
        <div class="logo-area">
            <img src="image-removebg-preview.png" alt="Hacka Nave Logo" class="logo-top-img" style="max-width: 140px;">
            <h1 class="logo-text">Checagem de Imagens</h1>
            <div class="tagline">Vz-Dev 2026</div>
        </div>

        <div id="voiceIndicator" class="voice-input-indicator">👇 Clique em qualquer lugar para liberar o microfone.</div>

        <div class="upload-card" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon" style="font-size: 45px; display: block;">🖼️</span>
            <span id="uploadText">Clique para carregar um arquivo de imagem (PNG, JPG, WEBP)</span>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <img id="preview" alt="Prévia da imagem">
        </div>

        <button id="analyzeBtn" class="btn-analyze" onclick="analisarImagem()" disabled>Iniciar Varredura</button>

        <div class="loading" id="loading">Analisando pixels estruturais e metadados... Aguarde.</div>

        <div class="result-box" id="resultBox"></div>
    </div>

    <div id="navAlertPopup" class="nav-popup"></div>

<script>
    const GROQ_API_KEY = "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"; // Insira sua chave de API aqui se necessário
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const uploadText = document.getElementById('uploadText');
    const voiceIndicator = document.getElementById('voiceIndicator');
    
    let imagemBase64Completa = null;
    let modoAtivo = null;
    let synth = window.speechSynthesis;
    let recognition = null;
    let micIniciado = false;

    // ----- INICIALIZAÇÃO CORRIGIDA DO MICROFONE -----
    function inicializarMicrofone() {
        if (micIniciado) return;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechObj = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechObj();
            recognition.lang = 'pt-BR';
            
            // Solução para o pop-up repetido: continuous como TRUE mantém a sessão ativa 
            // sem precisar fechar e reabrir o microfone a cada pausa.
            recognition.continuous = true; 
            recognition.interimResults = false;

            recognition.onstart = function() {
                micIniciado = true;
                if(!modoAtivo){
                    voiceIndicator.innerText = "🎤 Ouvindo... Diga 'Acessibilidade'";
                    voiceIndicator.className = "voice-input-indicator listening";
                }
            };

            recognition.onerror = function(event) {
                console.error("Erro capturado no microfone:", event.error);
                if(event.error === 'not-allowed') {
                    voiceIndicator.innerText = "❌ Ative a permissão do microfone no topo do navegador.";
                    voiceIndicator.className = "voice-input-indicator error";
                }
            };

            recognition.onresult = function(event) {
                // Captura a última frase dita para evitar conflito em loops contínuos
                const indexAtual = event.resultIndex;
                const falaUsuario = event.results[indexAtual][0].transcript.toLowerCase().replace(/[\.\?,]/g, '').trim();
                console.log("Comando identificado:", falaUsuario);
                
                if (falaUsuario.includes("voltar") || falaUsuario.includes("início") || falaUsuario.includes("inicio")) {
                    falarNarracao("A retornar ao módulo inicial.");
                    setTimeout(() => {
                        // Altera para o nome exato do teu arquivo de menu (ex: Hackanav.html ou inicio.html)
                        window.location.href = "inicio.html"; 
                    }, 1500); // Aguarda 1,5 segundos para que o utilizador ouça a confirmação por voz antes de mudar de página
                    return;
                }
                
                if (falaUsuario.includes("acessibilidade")) {
                    if (modoAtivo !== 'cego') {
                        toggleModo('cego');
                    }
                } else if (falaUsuario.includes("iniciar") || falaUsuario.includes("varrer") || falaUsuario.includes("analisar")) {
                    if(!analyzeBtn.disabled) {
                        analisarImagem();
                    }
                }
            };

            // O encerramento agora só acontece se houver falha crítica do navegador
            recognition.onend = function() {
                if (micIniciado && modoAtivo === 'cego') {
                    try { recognition.start(); } catch(e){}
                }
            };

            try { recognition.start(); } catch(e) { console.log("Instância do microfone já ativa."); }
        } else {
            voiceIndicator.innerText = "❌ Navegador incompatível com API de voz.";
            voiceIndicator.className = "voice-input-indicator error";
        }
    }

    // Gatilhos globais de inicialização do microfone
    window.addEventListener('click', inicializarMicrofone);
    window.addEventListener('keydown', function(e) {
        inicializarMicrofone();
        if (e.code === "Space") {
            toggleModo('cego');
        }
    });

    // ----- GESTÃO DE MODOS DE ACESSIBILIDADE -----
    function toggleModo(modo) {
        if(synth) synth.cancel();

        document.body.classList.remove('large-fonts');
        document.getElementById('btnIdoso').classList.remove('active');
        document.getElementById('btnCego').classList.remove('active');

        if (modoAtivo === modo) {
            modoAtivo = null;
            voiceIndicator.innerText = "🎤 Ouvindo... Diga 'Acessibilidade'";
            voiceIndicator.className = "voice-input-indicator listening";
            return;
        }

        modoAtivo = modo;
        document.getElementById('btn' + modo.charAt(0).toUpperCase() + modo.slice(1)).classList.add('active');

        if (modo === 'idoso') {
            document.body.classList.add('large-fonts');
            voiceIndicator.innerText = "👵 Modo Idoso. Fale 'Iniciar' ou use a tela.";
            voiceIndicator.className = "voice-input-indicator listening";
            falarNarracao("Modo idoso ativado. Textos ampliados.");
        }

        if (modo === 'cego') {
            voiceIndicator.innerText = "👁️ Modo Cego. Fale 'Iniciar' para escanear.";
            voiceIndicator.className = "voice-input-indicator listening";
            falarNarracao("Modo para deficientes visuais ativado. Fale Iniciar para varrer o arquivo carregado.");
        }
    }

    // ----- SÍNTESE DE VOZ (NARRAÇÃO) -----
    function falarNarracao(texto) {
        if(!synth || (modoAtivo !== 'idoso' && modoAtivo !== 'cego')) return;
        synth.cancel(); 
        let textoLimpo = texto.replace(/<\/?[^>]+(>|$)/g, "").replace(/\*\*/g, "");
        let utterance = new SpeechSynthesisUtterance(textoLimpo);
        utterance.lang = 'pt-BR';
        synth.speak(utterance);
    }

    // ----- CARREGAMENTO DO ARQUIVO -----
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(readerEvent) {
                preview.src = readerEvent.target.result;
                preview.style.display = 'block';
                imagemBase64Completa = readerEvent.target.result;
                analyzeBtn.disabled = false;
                uploadText.innerText = `Arquivo carregado: ${file.name}`;
                falarNarracao(`Imagem ${file.name} carregada e pronta para varredura.`);
            }
            reader.readAsDataURL(file);
        }
    });

    // ----- POPUP ALERTA -----
    function mostrarPopup(mensagem, tipo) {
        const popup = document.getElementById('navAlertPopup');
        popup.innerText = message = mensagem;
        popup.className = 'nav-popup'; 
        
        if(tipo === 'verdadeiro') popup.classList.add('pop-verde');
        else popup.classList.add('pop-vermelho');

        popup.classList.add('show');
        setTimeout(() => { popup.classList.remove('show'); }, 4000);
    }

    // ----- ANÁLISE PRINCIPAL DA IA -----
    async function analisarImagem() {
        if (!GROQ_API_KEY || GROQ_API_KEY === "COLE_SUA_CHAVE_AQUI") {
            alert("Por favor, configure sua API Key diretamente no código (variável GROQ_API_KEY).");
            return;
        }

        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');

        document.body.classList.remove('is-true', 'is-fake');
        loading.style.display = 'block';
        resultBox.style.display = 'none';
        analyzeBtn.disabled = true;

        falarNarracao("Analisando pixels estruturais e metadados. Aguarde.");

        const promptContexto = `
            Analise esta imagem cuidadosamente (pode ser print, foto, meme ou notícia).
            Aja como um checador de fatos profissional.
            
            Responda rigorosamente em português estruturando assim:
            1. **Veredito Inicial**: (Diga se hay indícios de ser FAKE NEWS, VERDADEIRA, FORA DE CONTEXTO ou ENGANOSA).
            2. **Análise de Elementos**: (Aponte sinais de manipulação, contradições ou erros textuais).
            3. **Argumentação**: (Explique o contexto real conhecido desse fato ou imagem).
            4. **fonte**:(onde encontrou a informação, se possível).
        `;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-4-scout-17b-16e-instruct", 
                    messages: [
                        {
                            role: "user",
                            content: [
                                { type: "text", text: promptContexto },
                                {
                                    type: "image_url",
                                    image_url: {
                                        url: imagemBase64Completa
                                    }
                                }
                            ]
                        }
                    ],
                    temperature: 0.2
                })
            });

            if (!response.ok) {
                const erroData = await response.json();
                throw new Error(erroData.error?.message || "Erro na requisição");
            }

            const dados = await response.json();
            const textoResposta = dados.choices[0].message.content;

            resultBox.innerHTML = formatarTexto(textoResposta);
            resultBox.style.display = 'block';
            
            const upperResposta = textoResposta.toUpperCase();

            if(upperResposta.includes("FAKE") || upperResposta.includes("ENGANOSA")) {
                resultBox.style.borderLeftColor = "#ff4d6d"; 
                document.body.classList.add('is-fake');
                mostrarPopup("CONTEÚDO FAKE DETECTADO", "fake");
                falarNarracao("Atenção. Conteúdo fake detectado.");
            } else {
                resultBox.style.borderLeftColor = "#10b981"; 
                document.body.classList.add('is-true');
                mostrarPopup("CONTEÚDO VERÍDICO", "verdadeiro");
                falarNarracao("Análise concluída. Conteúdo verídico.");
            }

            setTimeout(() => {
                falarNarracao("Relatório completo: " + textoResposta);
            }, 4000);

        } catch (error) {
            console.error(error);
            alert("Erro na análise da Groq: " + error.message);
            falarNarracao("Erro operacional na varredura da imagem.");
        } finally {
            loading.style.display = 'none';
            analyzeBtn.disabled = false;
        }
    }

    function formatarTexto(texto) {
        return texto.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }
</script>

</body>
</html>
