<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Academy - Hacka Nave</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090312;
            --neon-purple: #a855f7;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --correct: #22c55e;
            --wrong: #ef4444;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: white;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quiz-card {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .header-info { display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon-blue); margin-bottom: 10px; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue)); transition: 0.4s; }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--neon-purple);
        }

        .question { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; min-height: 60px; }

        .options { display: flex; flex-direction: column; gap: 10px; }

        .opt-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            color: white;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .opt-btn.correct { background: var(--correct) !important; border-color: #fff; }
        .opt-btn.wrong { background: var(--wrong) !important; }

        .next-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: var(--neon-purple);
            color: white;
            font-family: 'Orbitron';
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        /* TELA FINAL */
        #resultScreen { text-align: center; display: none; }
        .score-circle {
            width: 120px; height: 120px;
            border: 5px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            font-size: 2rem;
            font-family: 'Orbitron';
            box-shadow: 0 0 20px var(--neon-blue);
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div id="quiz-content">
            <div class="header-info">
                <span id="modLabel">Módulo 1</span>
                <span id="quesLabel">Questão 1/10</span>
            </div>
            <div class="progress-bar"><div id="progressFill"></div></div>

            <div class="video-container" id="videoWrapper">
                <iframe id="videoPlayer" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <div class="question" id="qText">Carregando...</div>
            <div class="options" id="optionsBox"></div>
            <button class="next-btn" id="nextBtn" onclick="nextAction()">PRÓXIMA</button>
        </div>

        <div id="resultScreen">
            <h2 style="font-family: 'Orbitron'; color: var(--neon-blue);">MISSÃO CONCLUÍDA!</h2>
            <div class="score-circle" id="finalScore">0</div>
            <p id="scoreMsg">Ótimo trabalho!</p>
            <p style="margin-top: 10px; color: #a295c0;">Você concluiu todos os módulos de treinamento contra desinformação.</p>
            <button class="next-btn" style="display: block;" onclick="location.href='inicio.html'">VOLTAR AO INÍCIO</button>
        </div>
    </div>

    <script>
        const modules = {
            1: {
                video: "https://www.youtube.com/embed/w0SSIUq4M9M", 
                questions: [
                    { q: "Qual é o tema principal do video?", opts: ["Uso do WhatsApp", "Conceito e perigos da desinformação", "Crescimento do TikTok", "História da IA"], ans: 1 },
                    { q: "Qual é o principal objetivo da desinformação digital?", opts: ["Divertir pessoas", "Enganar ou causar confusão", "Ensinar tecnologia", "Promover notícias"], ans: 1 },
                    { q: "Em quais formatos a desinformação pode aparecer?", opts: ["Apenas texto", "Apenas vídeo", "Textos, vídeos, imagens e IA", "Apenas áudio"], ans: 2 },
                    { q: "O que faz uma informação falsa viralizar mais rápido?", opts: ["Palavras difíceis", "Conteúdo antigo", "Nível de polêmica", "Dados científicos"], ans: 2 },
                    { q: "Quais redes são citadas como meios de espalhamento?", opts: ["WhatsApp, TikTok e vídeos cortados", "E-mails e Blogs", "Apps de bancos", "Linkedin e Jornais"], ans: 0 },
                    { q: "O que são 'deepfakes'?", opts: ["Notícias anônimas", "Vídeos manipulados com IA realistas", "Fotos antigas", "Mensagens de voz"], ans: 1 },
                    { q: "Exemplos comuns de desinformação listados:", opts: ["Fofocas", "Previsão do tempo", "Sorteios", "Política, saúde e vídeos manipulados"], ans: 3 },
                    { q: "Por que a desinformação é perigosa?", opts: ["Gasta bateria", "Causa medo e põe vidas em risco", "Reduz a velocidade da internet", "Afasta a família"], ans: 1 },
                    { q: "Atitude recomendada antes de compartilhar:", opts: ["Enviar para todos", "Conferir a fonte e pesquisar", "Apagar o app", "Curtir para engajar"], ans: 1 },
                    { q: "De quem é a responsabilidade de combater a desinformação?", opts: ["Donos das redes", "Polícia", "De cada um de nós", "Jornalistas"], ans: 2 }
                ]
            },
            2: {
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                questions: [
                    { q: "Qual o principal objetivo da criação da desinformação?", opts: ["Entreter", "Gerar lucro ou confusão planejada", "Testar internet", "Ensinar idosos"], ans: 1 },
                    { q: "Qual o primeiro passo da desinformação nas redes?", opts: ["Compartilhamento", "Verificação", "Criação de informação falsa", "Exclusão da conta"], ans: 2 },
                    { q: "Recurso muito usado para atrair cliques:", opts: ["Vírus", "Título chamativo e apelativo", "Bibliografia", "Design P&B"], ans: 1 },
                    { q: "Por que milhares acreditam em mentiras?", opts: ["Compartilham sem verificar", "Governo obriga", "Internet só aceita verdades", "Redes deletam na hora"], ans: 0 },
                    { q: "Técnica visual de desinformação citada:", opts: ["Textos longos", "Imagens editadas e vídeos cortados", "Gráficos oficiais", "Fotos de satélite"], ans: 1 },
                    { q: "Outro tipo de mídia manipulada usada:", opts: ["Livros", "Áudios falsos", "E-mails", "Mensagens de operadora"], ans: 1 },
                    { q: "O que significa 'conteúdo fora de contexto'?", opts: ["Distorcer o sentido original", "Texto sem erro", "Tradução perfeita", "Uso em PCs"], ans: 0 },
                    { q: "Por que acreditam fácil em fake news?", opts: ["Prêmios", "Confirma o que elas já pensam", "Não sabem ler", "Cientistas famosos"], ans: 1 },
                    { q: "Atitude para evitar desinformação:", opts: ["Perguntar a amigos", "Ler só título", "Pesquisar em sites confiáveis", "Apagar redes"], ans: 2 },
                    { q: "Mensagem final sobre o uso da internet:", opts: ["É sempre segura", "Informação exige responsabilidade", "Compartilhar por impulso", "Títulos são confiáveis"], ans: 1 }
                ]
            },
            3: {
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                questions: [
                    { q: "Quanto tempo uma mentira leva para alcançar milhões?", opts: ["Dias", "Horas", "Minutos", "Segundos"], ans: 2 },
                    { q: "A desinformação é um problema de qual período?", opts: ["Era industrial", "Era digital", "Século passado", "História moderna"], ans: 1 },
                    { q: "O que NÃO é impacto da desinformação?", opts: ["Medo", "Aumento do desemprego tecnológico", "Divisão", "Manipulação"], ans: 1 },
                    { q: "Outro grande impacto social citado:", opts: ["Influenciar eleições", "Mudar clima", "Reduzir internet", "Substituir TV"], ans: 0 },
                    { q: "Por que redes espalham conteúdo rápido?", opts: ["Grátis", "Priorizam emoção", "Bloqueiam notícias", "Funcionam à noite"], ans: 1 },
                    { q: "O que são Deepfakes?", opts: ["Senhas", "Vídeos falsos realistas com IA", "Vírus", "Filtros"], ans: 1 },
                    { q: "Verificação manual da veracidade é:", opts: ["Educação", "Pensamento", "Consciência", "Checagem de fatos"], ans: 3 },
                    { q: "O que ter no momento de enviar um conteúdo?", opts: ["Pressa", "Consciência", "Desconfiança", "Certeza"], ans: 1 },
                    { q: "A informação pode fazer o que além de mentiras?", opts: ["Lucro", "Construir conhecimento", "Substituir livros", "Entreter"], ans: 1 },
                    { q: "Onde começa a escolha de construir conhecimento?", opts: ["Em cada clique", "Escolas", "Termos de uso", "Governo"], ans: 0 }
                ]
            }
        };

        let currentMod = 1;
        let currentQ = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const data = modules[currentMod];
            const q = data.questions[currentQ];

            document.getElementById('modLabel').innerText = `MÓDULO ${currentMod}`;
            document.getElementById('quesLabel').innerText = `QUESTÃO ${currentQ + 1}/10`;
            document.getElementById('videoPlayer').src = data.video;
            document.getElementById('qText').innerText = q.q;
            document.getElementById('nextBtn').style.display = 'none';

            const optionsBox = document.getElementById('optionsBox');
            optionsBox.innerHTML = '';
            q.opts.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => check(i, btn);
                optionsBox.appendChild(btn);
            });

            const totalQ = 30;
            const progress = (( (currentMod-1) * 10 + currentQ) / totalQ) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function check(idx, btn) {
            if(answered) return;
            answered = true;
            const correct = modules[currentMod].questions[currentQ].ans;
            
            if(idx === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.opt-btn')[correct].classList.add('correct');
            }
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextAction() {
            if(currentQ < 9) {
                currentQ++;
                loadQuestion();
            } else if (currentMod < 3) {
                currentMod++;
                currentQ = 0;
                alert("Módulo concluído! Vamos para o próximo.");
                loadQuestion();
            } else {
                finish();
            }
        }

        function finish() {
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('finalScore').innerText = score;
            const msg = score > 25 ? "Excepcional! Você é um mestre da verdade." : score > 15 ? "Bom trabalho! Continue se informando." : "Precisa praticar mais! Estude os módulos novamente.";
            document.getElementById('scoreMsg').innerText = msg;
        }

        loadQuestion();
    </script>
</body>
</html>
