<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacka Nav - Quiz Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090312;
            --neon-purple: #a855f7;
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --correct: #22c55e;
            --wrong: #ef4444;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1a0b2e, #090312);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .logo-text { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 2px; }

        .quiz-container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .progress-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--neon-purple); }

        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            transition: width 0.4s ease;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.4);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; line-height: 1.5; color: #eee; }

        .options-grid { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 20px;
            border-radius: 12px;
            color: #ddd;
            cursor: pointer;
            text-align: left;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(.correct):not(.wrong) { background: rgba(255, 255, 255, 0.12); border-color: var(--neon-blue); transform: translateX(5px); }

        .option-btn.correct { background: var(--correct) !important; border-color: #4ade80; color: white; font-weight: 600; }

        .option-btn.wrong { background: var(--wrong) !important; border-color: #f87171; color: white; opacity: 0.8; }

        .next-btn {
            margin-top: 30px;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-blue));
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .result-screen { text-align: center; display: none; padding: 40px 0; }
        .back-home { display: inline-block; margin-top: 30px; color: var(--neon-blue); text-decoration: none; font-weight: bold; border: 1px solid var(--neon-blue); padding: 10px 20px; border-radius: 50px; transition: 0.3s; }
        .back-home:hover { background: var(--neon-blue); color: black; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="logo-text">Hacka Nave Academy</h1>
    </div>

    <div class="quiz-container">
        <div class="progress-info">
            <span id="moduleTitle">Módulo 1</span>
            <span id="questionCounter">Pergunta 1/10</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="quiz-content">
            <div class="video-wrapper" id="videoArea">
                <iframe id="currentVideo" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>

            <div class="question-text" id="questionText">Carregando pergunta...</div>
            
            <div class="options-grid" id="optionsGrid"></div>

            <button class="next-btn" id="nextBtn" onclick="nextStep()">PRÓXIMA PERGUNTA</button>
        </div>

        <div id="resultScreen" class="result-screen">
            <h2 style="font-size: 2rem; color: var(--neon-blue); font-family: 'Orbitron';">TREINAMENTO CONCLUÍDO! 🛸</h2>
            <p style="margin: 20px 0; font-size: 1.1rem;">Parabéns! Você completou os 3 módulos de defesa digital.</p>
            <div id="scoreText" style="font-size: 1.3rem; margin-bottom: 10px;"></div>
            <a href="inicio.html" class="back-home">Voltar ao Painel Central</a>
        </div>
    </div>

    <script>
        const quizData = {
            1: {
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ", // Link Vídeo Módulo 1
                questions: [
                    { q: "Qual é o tema principal do video?", options: ["O uso correto do WhatsApp", "O conceito e os perigos da desinformação digital", "O crescimento do TikTok no Brasil", "A história da inteligência artificial"], correct: 1 },
                    { q: "Segundo o video, qual é o principal objetivo da desinformação digital?", options: ["Divertir os internautas", "Enganar, manipular opiniões ou causar confusão", "Ensinar tecnologias para idosos", "Promover canais confiáveis"], correct: 1 },
                    { q: "Em quais formatos a desinformação digital pode aparecer?", options: ["Apenas textos curtos", "Vídeos de longa duração", "Textos, vídeos, imagens, áudios e IA", "Somente áudios no WhatsApp"], correct: 2 },
                    { q: "O que faz uma informação falsa viralizar mais rápido?", options: ["Palavras difíceis", "Conteúdo antigo", "O nível de polêmica", "Dados científicos comprovados"], correct: 2 },
                    { q: "Quais redes e formatos são citados como meios de espalhamento?", options: ["WhatsApp, TikTok, vídeos fora de contexto e manchetes", "E-mails, blogs de culinária e SMS", "Apps de bancos e podcasts", "Linkedin e anúncios de jornal"], correct: 0 },
                    { q: "O que são 'deepfakes', de acordo com o roteiro?", options: ["Notícias anônimas", "Vídeos manipulados com IA realistas", "Fotos de arquivos públicos", "Mensagens de voz de robôs"], correct: 1 },
                    { q: "Quais são os exemplos comuns de desinformação listados?", options: ["Fofocas e dicas de moda", "Clima e futebol", "Vagas falsas e sorteios", "Notícias de política, saúde e vídeos manipulados"], correct: 3 },
                    { q: "Por que a desinformação digital é considerada perigosa?", options: ["Consome armazenamento", "Causa medo, manipula eleições e põe vidas em risco", "Reduz a velocidade da internet", "Afasta as pessoas da família"], correct: 1 },
                    { q: "Que atitude o roteiro recomenda antes de compartilhar?", options: ["Enviar para todos imediatamente", "Conferir a fonte e pesquisar", "Apagar o app de mensagens", "Curtir para ajudar no engajamento"], correct: 1 },
                    { q: "De quem é a responsabilidade de combater a desinformação?", options: ["Apenas donos das redes", "Governos e polícia", "De cada um de nós", "Somente jornalistas"], correct: 2 }
                ]
            },
            2: {
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ", // Link Vídeo Módulo 2
                questions: [
                    { q: "Qual o principal objetivo por trás da criação da desinformação digital?", options: ["Entreter as pessoas", "Gerar lucro, influência ou confusão", "Testar a internet", "Ensinar tecnologia"], correct: 1 },
                    { q: "Qual o primeiro passo para o funcionamento da desinformação?", options: ["Compartilhamento em massa", "Verificação por agência", "Criação de uma informação falsa", "Exclusão da conta"], correct: 2 },
                    { q: "Que recurso é usado para atrair cliques antes de ler?", options: ["Link de vírus", "Título chamativo e apelativo", "Lista bibliográfica", "Design preto e branco"], correct: 1 },
                    { q: "Por que milhares de pessoas acreditam em mentiras?", options: ["Compartilham sem verificar", "Governo obriga a ler", "Internet só aceita verdades", "Redes deletam mentiras"], correct: 0 },
                    { q: "Qual alternativa apresenta uma técnica visual de desinformação?", options: ["Textos longos", "Imagens editadas e vídeos cortados", "Gráficos oficiais", "Fotos de satélites"], correct: 1 },
                    { q: "Que outro tipo de mídia manipulada é usada para enganar?", options: ["Livros didáticos", "Áudios falsos", "E-mails criptografados", "Mensagens automáticas"], correct: 1 },
                    { q: "O que significa 'conteúdo fora de contexto'?", options: ["Usar informação real para distorcer sentido", "Texto sem erro", "Tradução perfeita", "Somente para computadores"], correct: 0 },
                    { q: "Por que as pessoas acreditam fácil em fake news?", options: ["Prêmios em dinheiro", "Confirma o que elas já pensam", "Não sabem ler", "Perfis de cientistas"], correct: 1 },
                    { q: "Qual atitude recomendada para evitar desinformação?", options: ["Enviar para amigos perguntando", "Ler apenas o título", "Verificar fonte em sites confiáveis", "Apagar redes sociais"], correct: 2 },
                    { q: "Qual mensagem final o roteiro deixa?", options: ["Internet é sempre segura", "Informação também exige responsabilidade", "Compartilhar tudo por impulso", "Títulos são confiáveis"], correct: 1 }
                ]
            },
            3: {
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ", // Link Vídeo Módulo 3
                questions: [
                    { q: "Quanto tempo uma mentira leva para alcançar milhões?", options: ["Dias", "Horas", "Minutos", "Segundos"], correct: 2 },
                    { q: "Desinformação é o maior problema de qual período?", options: ["Era industrial", "Era digital", "Século passado", "História moderna"], correct: 1 },
                    { q: "O que NÃO é citado como impacto social?", options: ["Medo e confusão", "Desemprego tecnológico", "Divisão entre pessoas", "Manipulação de opiniões"], correct: 1 },
                    { q: "Que outro grande impacto a desinformação causa?", options: ["Influenciar eleições", "Mudar o clima", "Reduzir uso de internet", "Substituir TV"], correct: 0 },
                    { q: "Por que redes sociais espalham conteúdos rápido?", options: ["São ferramentas grátis", "Priorizam conteúdos que geram emoção", "Bloqueiam notícias reais", "Funcionam de madrugada"], correct: 1 },
                    { q: "O que são 'deepfakes'?", options: ["Senhas de hackers", "Vídeos falsos realistas criados com IA", "Vírus de celular", "Filtros de olhos"], correct: 1 },
                    { q: "Qual ferramenta envolve verificação manual?", options: ["Educação digital", "Pensamento crítico", "Consciência", "Checagem de fatos"], correct: 3 },
                    { q: "O que devemos ter ao enviar um conteúdo?", options: ["Pressa", "Consciência ao compartilhar", "Desconfiança total", "Certeza de viralizar"], correct: 1 },
                    { q: "O que a informação pode fazer além de mentiras?", options: ["Lucros financeiros", "Construir conhecimento", "Substituir livros", "Entreter jovens"], correct: 1 },
                    { q: "Onde começa a escolha de construir conhecimento?", options: ["Em cada clique", "Nas escolas", "Termos de uso", "No governo"], correct: 0 }
                ]
            }
        };

        let currentModule = 1;
        let currentQuestionIdx = 0;
        let totalScore = 0;
        let isAnswered = false;

        function loadStep() {
            isAnswered = false;
            const module = quizData[currentModule];
            const q = module.questions[currentQuestionIdx];

            // UI
            document.getElementById('moduleTitle').innerText = `Módulo ${currentModule}`;
            document.getElementById('questionCounter').innerText = `Pergunta ${currentQuestionIdx + 1}/10`;
            document.getElementById('questionText').innerText = q.q;
            document.getElementById('currentVideo').src = module.video;
            document.getElementById('nextBtn').style.display = 'none';

            // Opções
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                grid.appendChild(btn);
            });

            // Barra (3 módulos de 10 = 30 total)
            const totalQ = 30;
            const currentTotal = ((currentModule - 1) * 10) + (currentQuestionIdx + 1);
            document.getElementById('progressBar').style.width = (currentTotal / totalQ * 100) + '%';
        }

        function checkAnswer(idx, btn) {
            if (isAnswered) return;
            isAnswered = true;
            const correct = quizData[currentModule].questions[currentQuestionIdx].correct;
            const btns = document.querySelectorAll('.option-btn');

            if (idx === correct) {
                btn.classList.add('correct');
                totalScore++;
            } else {
                btn.classList.add('wrong');
                btns[correct].classList.add('correct');
            }

            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestionIdx === 9 && currentModule < 3) {
                nextBtn.innerText = "PRÓXIMO MÓDULO ➡️";
            } else if (currentQuestionIdx === 9 && currentModule === 3) {
                nextBtn.innerText = "VER RESULTADO FINAL 🏁";
            } else {
                nextBtn.innerText = "PRÓXIMA PERGUNTA";
            }
            nextBtn.style.display = 'block';
        }

        function nextStep() {
            if (currentQuestionIdx < 9) {
                currentQuestionIdx++;
                loadStep();
            } else if (currentModule < 3) {
                currentModule++;
                currentQuestionIdx = 0;
                alert(`Módulo ${currentModule-1} completo! Iniciando Módulo ${currentModule}. Assista ao novo vídeo.`);
                loadStep();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('moduleTitle').parentElement.style.display = 'none';
            document.getElementById('progressBar').parentElement.style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('scoreText').innerHTML = `Pontuação Final: <strong>${totalScore}</strong> de 30 acertos.`;
        }

        loadStep();
    </script>
</body>
</html>
